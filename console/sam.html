<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Séance · Sam's agent</title>
<style>
  /* Same tokens as the chat pages and console. */
  :root {
    color-scheme: dark;
    --bg: #121018; --panel: #1c1926; --raised: #282338; --line: #423a58;
    --text: #f4f1f9; --muted: #c9c3d6; --accent: #c6b3ff; --on-fill: #15121c;
    --ok: #7be0ab; --warn: #f6cc72; --bad: #ff9c95;
    --text-sm: 16px; --text-md: 18px; --text-lg: 21px; --text-xl: 30px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; grid-template-rows: auto minmax(0, 1fr) auto;
    background: var(--bg); color: var(--text);
    font: var(--text-md)/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .masthead { display: flex; align-items: baseline; gap: 14px; padding: 10px 24px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .masthead h1 { margin: 0; font: 600 var(--text-xl)/1.2 "Iowan Old Style", "Palatino Linotype", Georgia, serif; color: var(--accent); }
  .org { color: var(--muted); font-size: var(--text-sm); font-weight: 600; }
  .view { margin-left: auto; display: flex; align-items: baseline; gap: 12px; }
  .view strong { font-size: var(--text-lg); }
  .view span { color: var(--muted); font-size: var(--text-sm); }
  #log { overflow-y: auto; padding: 24px max(16px, calc((100% - 860px) / 2)); display: flex; flex-direction: column; gap: 14px; }
  .bubble { max-width: 760px; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--line); white-space: pre-wrap; }
  .me { align-self: flex-end; background: #3a2f5c; border-color: #5a4a8a; }
  .agent { align-self: flex-start; background: var(--panel); }
  .who { display: block; font-size: var(--text-sm); font-weight: 700; color: var(--accent); margin-bottom: 4px; }
  .access { margin-top: 10px; display: flex; gap: 22px; flex-wrap: wrap; white-space: normal; }
  .access label { display: flex; gap: 8px; align-items: center; cursor: pointer; font-weight: 600; }
  .access input { width: 20px; height: 20px; accent-color: var(--accent); }
  .note { color: var(--muted); font-size: var(--text-sm); margin-top: 8px; white-space: normal; }
  .err { border-color: var(--bad); }
  form { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; padding: 14px max(16px, calc((100% - 860px) / 2)); background: var(--panel); border-top: 1px solid var(--line); }
  textarea { font: inherit; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--raised); color: var(--text); resize: vertical; min-height: 3.2em; }
  button { font: inherit; font-weight: 700; padding: 0 20px; border-radius: 8px; border: 0; background: var(--accent); color: var(--on-fill); cursor: pointer; }
  button:disabled { opacity: .6; cursor: progress; }
  .hint { grid-column: 1 / -1; margin: 0; color: var(--muted); font-size: var(--text-sm); }
</style>
</head>
<body>
  <header class="masthead">
    <h1>Séance</h1>
    <span class="org">XYZ Company</span>
    <div class="view"><strong>Sam's agent</strong><span>Sam · Software team owner</span></div>
  </header>

  <div id="log" aria-live="polite"></div>

  <form id="form">
    <textarea id="text" rows="3" aria-label="Tell your agent">X database ingest format: Send JSON to the X database /ingest endpoint. Each record: device_id (string), ts (ISO-8601, UTC), metric (string), value (number), unit (SI unit string). Batch up to 500 records per POST; gzip bodies over 1 MB.</textarea>
    <button id="send" type="submit">Tell agent</button>
    <p class="hint">Write "topic: details". Your agent keeps it in the Software team's Durable Actor and answers the teams you allow, so they never have to ask you.</p>
  </form>

<script>
  const log = document.getElementById("log");
  const GROUPS = { controls: "asker-priya", robotics: "asker-robotics" };
  let accessWrites = 0;
  let taughtCount = 0;

  function bubble(cls, who, text) {
    const b = document.createElement("div");
    b.className = `bubble ${cls}`;
    const w = document.createElement("span");
    w.className = "who";
    w.textContent = who;
    b.append(w, document.createTextNode(text));
    log.append(b);
    log.scrollTop = log.scrollHeight;
    return b;
  }

  const DEFAULT_TEXT = document.getElementById("text").value;

  function greet() {
    log.replaceChildren();
    document.getElementById("text").value = DEFAULT_TEXT;
    bubble("agent", "Sam's agent", "Hi Sam. Tell me anything other teams keep asking you, and choose who may ask me about it.");
  }

  // "topic: details" -> title + text; without a colon the first words are the title.
  function split(input) {
    const i = input.indexOf(":");
    if (i > 2 && i < 120) return { title: input.slice(0, i).trim(), text: input.slice(i + 1).trim() };
    return { title: input.split(/\s+/).slice(0, 8).join(" "), text: input.trim() };
  }

  function accessBox() {
    const wrap = document.createElement("div");
    wrap.className = "access";
    for (const [group, label] of [["controls", "Controls"], ["robotics", "Robotics"]]) {
      const l = document.createElement("label");
      const box = document.createElement("input");
      box.type = "checkbox";
      box.dataset.group = group;
      box.addEventListener("change", () => setAccess(box));
      l.append(box, document.createTextNode(` ${label}`));
      wrap.append(l);
    }
    return wrap;
  }

  async function setAccess(box) {
    accessWrites++;
    try {
      const res = await fetch("/team-access", { method: "POST", body: JSON.stringify({ team: "software", group: box.dataset.group, allowed: box.checked }) });
      if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error ?? res.status);
    } catch (err) {
      box.checked = !box.checked;
      bubble("agent err", "Sam's agent", `Couldn't change access: ${err.message}`);
    } finally {
      accessWrites--;
    }
  }

  document.getElementById("form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const input = document.getElementById("text").value.trim();
    if (!input) return;
    const send = document.getElementById("send");
    send.disabled = true;
    bubble("me", "Sam", input);
    try {
      const { title, text } = split(input);
      const res = await fetch("/teach", { method: "POST", body: JSON.stringify({ team: "software", title, text }) });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(body.error ?? res.status);
      taughtCount++;
      const b = bubble("agent", "Sam's agent", `Got it. I saved "${title}" as ${body.id}. Which teams may ask me about it?`);
      b.append(accessBox());
      const n = document.createElement("div");
      n.className = "note";
      n.textContent = "Ticking a team applies at once. Teams you leave unticked are told it exists, never what it says.";
      b.append(n);
      document.getElementById("text").value = "";
    } catch (err) {
      bubble("agent err", "Sam's agent", `I couldn't save that: ${err.message}`);
    } finally {
      send.disabled = false;
    }
  });

  // Mirror the actor: box state from the Software policy; the console's Reset clears this page.
  async function poll() {
    try {
      const s = await (await fetch("/snapshot/software")).json();
      const taught = s.knowledge.filter((e) => e.source === "owner_answer").length;
      if (taughtCount > 0 && taught === 0) { taughtCount = 0; greet(); }
      if (accessWrites === 0) {
        for (const box of log.querySelectorAll(".access input")) {
          const agent = GROUPS[box.dataset.group];
          box.checked = (s.policy.clearance[agent] ?? s.policy.defaultClearance) >= 1;
        }
      }
    } catch {}
    setTimeout(poll, 1000);
  }

  greet();
  poll();
</script>
</body>
</html>
